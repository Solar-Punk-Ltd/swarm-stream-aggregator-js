syntax = "proto3";

message StreamEntry {
  string owner = 1;
  string topic = 2;
  string title = 3;
  string state = 4;
  string mediaType = 5;
  optional uint64 createdAt = 6;
  optional uint64 updatedAt = 7;
  optional uint32 index = 8;
  optional uint32 duration = 9;
  optional string thumbnail = 10;
  optional string description = 11;
  optional string scheduledStartTime = 12;
  optional bool pinned = 13;
}

message StreamList {
  repeated StreamEntry entries = 1;
}
